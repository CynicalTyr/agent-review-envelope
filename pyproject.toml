[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-review-envelope"
version = "0.1.0"
description = "Schema-locked filesystem envelopes so agent workers cannot message humans until a different process judges."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "CynicalTyr" }]
keywords = ["ai-agents", "llm", "outbox", "review-queue", "fail-closed"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = []
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/CynicalTyr/agent-review-envelope"
Issues = "https://github.com/CynicalTyr/agent-review-envelope/issues"

[tool.setuptools]
py-modules = ["review_queue", "paths"]
